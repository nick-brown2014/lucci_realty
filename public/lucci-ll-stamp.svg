<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Transparent background — nothing here intentionally -->

  <!-- "Lucci" top label -->
  <text x="100" y="62" font-family="Montserrat, sans-serif" font-size="9" font-weight="200" letter-spacing="7" fill="rgba(201,169,110,0.6)" text-anchor="middle">LUCCI</text>

  <!-- LL main letters -->
  <text x="100" y="128" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="200" letter-spacing="6" fill="white" text-anchor="middle">LL</text>

  <!-- Hairline rule -->
